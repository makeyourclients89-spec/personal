name: Build Native Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Unit Tests & Media Stream Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies & run tests
        run: |
          cd backend
          npm install
          npm test

  build-android:
    name: Build Native Android APK & Unit Tests
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./android_native/gradlew

      - name: Run Native Android Unit Tests
        run: |
          cd android_native
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Native Android Debug APK
        run: |
          cd android_native
          ./gradlew assembleDebug --no-daemon

      - name: Upload Native Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NativeCallAssistant-debug-apk
          path: android_native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
