name: Build & Run on Android Emulator

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Android Emulator API Level'
        required: true
        default: '29'
        type: choice
        options:
          - '29'
          - '30'
          - '34'

jobs:
  backend-test:
    name: Backend Unit Tests & Media Stream Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies & run tests
        run: |
          cd backend
          npm install
          npm test

  build-and-run-emulator:
    name: Build Native APK & Run on Android Emulator
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle wrapper jar & permissions
        run: |
          cd android_native
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew

      - name: Run Native Android Unit Tests
        run: |
          cd android_native
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Native Android Debug APK
        run: |
          cd android_native
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AI_Assistant_Native_v2.apk

      - name: Upload Native Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Assistant_Native_v2_APK
          path: android_native/app/build/outputs/apk/debug/AI_Assistant_Native_v2.apk
          retention-days: 14

      - name: Enable KVM group perms for Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android Emulator Runner
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ inputs.api_level || '29' }}
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
          script: |
            mkdir -p emulator_output
            adb wait-for-device
            adb install -r android_native/app/build/outputs/apk/debug/app-debug.apk
            
            # 1. Main Dashboard
            adb shell am start -n com.example.callassistant/.ui.MainActivity
            sleep 4
            adb exec-out screencap -p > emulator_output/01_main_dashboard.png
            
            # 2. 10-Second Countdown Incoming Call
            adb shell am start -n com.example.callassistant/.ui.IncomingCallActivity --es callerName RameshSwiggy --es callerNumber 9876543210
            sleep 4
            adb exec-out screencap -p > emulator_output/02_incoming_10s_countdown.png
            
            # 3. Active AI Screening & Takeover Button
            adb shell am start -n com.example.callassistant/.ui.ActiveCallActivity --es callerName RameshSwiggy
            sleep 4
            adb exec-out screencap -p > emulator_output/03_active_ai_takeover.png
            
            # 4. Call Details & Recording Player
            adb shell am start -n com.example.callassistant/.ui.CallDetailActivity --es callId seed_01
            sleep 4
            adb exec-out screencap -p > emulator_output/04_call_detail_recording.png
            
            # Dump Logs
            adb logcat -d > emulator_output/emulator_logcat.txt
            echo "Emulator execution and screen captures completed successfully!"

      - name: Upload Emulator Screenshots and Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Emulator-Screenshots-and-Logs
          path: emulator_output/
          retention-days: 14
